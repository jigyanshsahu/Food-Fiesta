services:
  # 1. THE BACKEND (API)
  - type: web
    name: food-fiesta-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render dashboard
      - key: JWT_SECRET
        sync: false # Generate a random secure key
      - key: STRIPE_SECRET_KEY
        sync: false # Stripe Secret Key (sk_test_...)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # Deployed URL of frontend (e.g. https://food-fiesta-frontend.onrender.com)
      - key: ADMIN_URL
        sync: false # Deployed URL of admin panel (e.g. https://food-fiesta-admin.onrender.com)
    plan: free

  # 2. THE FRONTEND (USER APP - 100% Free Static Site)
  - type: web
    name: food-fiesta-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false # Set to your backend URL (e.g. https://food-fiesta-backend.onrender.com)

  # 3. THE ADMIN PANEL (100% Free Static Site)
  - type: web
    name: food-fiesta-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false # Set to your backend URL (e.g. https://food-fiesta-backend.onrender.com)
